name: Staging uptime synthetic

on:
  schedule:
    # Every 5 minutes. GitHub Actions cron is best-effort and can drift by a
    # few minutes under load — that is acceptable for a placeholder app.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  ping:
    name: Hit /api/health and assert ok=true
    runs-on: ubuntu-latest
    env:
      HEALTH_URL: https://hiteshr90.github.io/brilworks-app/api/health
    steps:
      - name: Curl health endpoint
        id: curl
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          status=$(curl -sS -o "$response_file" -w "%{http_code}" --max-time 15 "$HEALTH_URL" || echo "000")
          body=$(cat "$response_file")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [[ "$status" != "200" ]]; then
            echo "Health endpoint returned HTTP $status (expected 200)" >&2
            exit 1
          fi
          ok=$(printf '%s' "$body" | jq -r '.ok // false')
          if [[ "$ok" != "true" ]]; then
            echo "Health endpoint returned ok=$ok (expected true)" >&2
            echo "Response body: $body" >&2
            exit 1
          fi
          echo "Health OK: $body"

      - name: Open uptime incident issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ steps.curl.outputs.status }}
          BODY: ${{ steps.curl.outputs.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Staging uptime check failing — HTTP ${STATUS:-?}"
          body=$(cat <<EOF
          The scheduled uptime synthetic against \`${HEALTH_URL}\` failed.

          - Run: ${RUN_URL}
          - HTTP status: \`${STATUS:-no-response}\`
          - Response body (truncated):

          \`\`\`
          ${BODY:-<empty>}
          \`\`\`

          Recovery: re-run the workflow once the staging deploy is healthy. Close this issue when the next scheduled run reports OK.
          EOF
          )
          gh issue create --title "$title" --body "$body" --label "uptime-incident,staging" || \
            gh issue create --title "$title" --body "$body"
